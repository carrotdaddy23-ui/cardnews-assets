<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사무실 네트워크 5분 점검표 | 베가네트웍스 수리팀장</title>
<meta name="description" content="회사 인터넷이 고장 나거나 뚫리기 전에, 전산 담당자가 5분 안에 확인할 7가지">
<meta property="og:title" content="사무실 네트워크 5분 점검표 | 수리팀장">
<meta property="og:description" content="업데이트·공유기·백업·퇴사자 계정·수상한 메일·랜선·스미싱. 하나씩 체크하세요.">
<style>
:root{--bg:#0A0A0A;--card:#161616;--fg:#FFFFFF;--muted:#A3A3A3;--accent:#38BDF8;--accentFg:#0A0A0A;--line:#262626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
.kicker{display:inline-block;background:var(--accent);color:var(--accentFg);font-weight:700;font-size:13px;padding:3px 10px;border-radius:6px}
h1{font-size:27px;line-height:1.3;margin:14px 0 8px}
.lead{color:var(--muted);margin:0 0 20px}
.progress{font-weight:700;color:var(--accent);margin:0 0 16px}
label.item{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px;cursor:pointer}
label.item input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.item b{display:block;font-size:17px;margin-bottom:4px}
.item span{color:var(--muted);font-size:15px}
.item.done{opacity:.55}
.cta{margin:28px 0 0;padding:18px;border:1px solid var(--accent);border-radius:12px}
.cta b{color:var(--accent)}
.cta a{color:var(--fg)}
.src{color:#737373;font-size:13px;margin-top:28px}
</style></head>
<body><main>
<span class="kicker">수리팀장 점검표</span>
<h1>사무실 네트워크 5분 점검표</h1>
<p class="lead">회사 인터넷이 고장 나거나 뚫리기 전에 전산 담당자가 확인할 7가지예요. 하나씩 체크해 보세요.</p>
<p class="progress" id="progress">0 / 7 확인</p>

<label class="item"><input type="checkbox"><div><b>1. 인터넷 장비 마지막 업데이트 날짜</b><span>스위치·공유기·방화벽 관리 화면에서 모델명과 펌웨어 버전을 보고, 제조사 보안 공지와 맞춰 보세요. 휴대폰과 달리 사람이 직접 눌러야 하고, 새로 산 장비도 설치하는 날 업데이트부터 해야 해요.</span></div></label>

<label class="item"><input type="checkbox"><div><b>2. 공유기 관리자 비밀번호</b><span>공유기 비밀번호는 두 개예요. 와이파이 연결용과 설정 화면에 들어가는 관리자용. 와이파이 비번만 바꾸면 설정 화면은 그대로 열려 있어요. 관리자 비번부터 바꾸세요.</span></div></label>

<label class="item"><input type="checkbox"><div><b>3. 백업 하나는 선을 뽑아서 따로</b><span>늘 꽂혀 있는 외장하드나 같은 네트워크의 백업은 랜섬웨어에 같이 잠길 수 있어요. 하나는 떼어 두고, 정말 복구되는지 가끔 열어 보세요.</span></div></label>

<label class="item"><input type="checkbox"><div><b>4. 퇴사자 계정 정지 + 모든 기기 로그아웃</b><span>비밀번호만 바꾸면 이미 로그인된 휴대폰·노트북은 한동안 열려 있을 수 있어요. 퇴사하는 날 계정 정지와 전체 로그아웃까지.</span></div></label>

<label class="item"><input type="checkbox"><div><b>5. 수상한 메일은 답장 말고 전화로</b><span>보낸 사람 이름은 누구나 바꿀 수 있어요. 첨부파일이 '콘텐츠 사용'을 눌러야 보인다고 하면 누르지 말고, 원래 알던 번호로 거래처에 전화해서 확인하세요.</span></div></label>

<label class="item"><input type="checkbox"><div><b>6. 랜선 겉면 글자</b><span>기가 인터넷인데 느리면 책상 밑 랜선을 보세요. CAT.5 만 적혀 있으면 최대 100메가예요. CAT.5e·CAT.6 이어야 기가 속도가 나와요.</span></div></label>

<label class="item"><input type="checkbox"><div><b>7. 스미싱 문자 눌렀다면</b><span>문자 속 주소를 누르기만 해서는 감염되지 않아요. 앱을 깔았다면 비행기 모드로 바꾸고, 다른 사람 전화로 112에 신고하세요. 정부 기관·은행은 문자로 앱 설치를 요구하지 않아요.</span></div></label>

<div class="cta"><b>직접 하기 어려우면</b><br>사무실 인터넷·와이파이·보안 장비 점검은 LG U+ 기업전문 베가네트웍스에 물어보세요.<br>상담 <a href="tel:15225443">1522-5443</a></div>

<p class="src">근거: KISA 보호나라 보안공지(2026-09-17 추석 기업 보안점검·스미싱 주의), 미국 CISA 실제 악용 취약점 목록, 이더넷 케이블 규격. 해당 제품·버전 여부는 제조사 공지 원문으로 확인하세요.</p>
</main>
<script>
(function(){var key="vega-office-checklist",boxes=[].slice.call(document.querySelectorAll('input[type=checkbox]'));
var saved=[];try{saved=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}
function render(){var n=0;boxes.forEach(function(b){b.closest('.item').classList.toggle('done',b.checked);if(b.checked)n++});document.getElementById('progress').textContent=n+' / '+boxes.length+' 확인';try{localStorage.setItem(key,JSON.stringify(boxes.map(function(b){return b.checked})))}catch(e){}}
boxes.forEach(function(b,i){b.checked=!!saved[i];b.addEventListener('change',render)});render();})();
</script>
</body></html>
